<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Merçendayzer</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f1f4f8;
}

.header{
    background:#1769aa;
    color:white;
    text-align:center;
    padding:22px;
    font-size:25px;
    font-weight:bold;
}

.container{
    max-width:500px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:22px;
    border-radius:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

select,
input{
    width:100%;
    padding:15px;
    margin-top:7px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:17px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    border:0;
    border-radius:10px;
    background:#1769aa;
    color:white;
    font-size:17px;
    font-weight:bold;
}

.green{
    background:#2e7d32;
}

.red{
    background:#c62828;
}

.gray{
    background:#555;
}

.hidden{
    display:none;
}

.message{
    margin-top:15px;
    padding:12px;
    text-align:center;
    border-radius:10px;
    font-weight:bold;
}

.error{
    background:#ffebee;
    color:#c62828;
}

.success{
    background:#e8f5e9;
    color:#2e7d32;
}

.item{
    background:#f7f7f7;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    border:1px solid #ddd;
}

</style>
</head>

<body>

<div class="header">
MERÇENDAYZER
</div>

<div class="container">

<!-- GİRİŞ -->

<div id="login" class="card">

<h2>🔐 Giriş</h2>

<label>İstifadəçi</label>

<select id="user">

<option value="mudir">Müdir</option>

<option value="mer1">Mer 1</option>
<option value="mer2">Mer 2</option>
<option value="mer3">Mer 3</option>
<option value="mer4">Mer 4</option>
<option value="mer5">Mer 5</option>
<option value="mer6">Mer 6</option>
<option value="mer7">Mer 7</option>
<option value="mer8">Mer 8</option>
<option value="mer9">Mer 9</option>
<option value="mer10">Mer 10</option>
<option value="mer11">Mer 11</option>

</select>

<label>Şifrə</label>

<input
id="pass"
type="password"
inputmode="numeric"
placeholder="1234"
>

<button onclick="giris()">
DAXİL OL
</button>

<div id="error" class="message error hidden">
Şifrə yanlışdır!
</div>

</div>


<!-- MÜDİR PANELİ -->

<div id="mudir" class="hidden">

<div class="card">

<h2>👨‍💼 Müdir Paneli</h2>

<div class="message success">
Müdir panelinə xoş gəlmisiniz.
</div>

<button onclick="mercendayzerler()">
👥 Merçendayzerlər
</button>

<button onclick="magazalar()">
🏪 Mağazalar
</button>

<button onclick="hesabat()">
📊 Hesabatlar
</button>

<button class="red" onclick="cixis()">
🚪 ÇIXIŞ
</button>

</div>

<div id="mudirContent"></div>

</div>


<!-- MERÇENDAYZER PANELİ -->

<div id="mer" class="hidden">

<div class="card">

<h2 id="merAdi">
Merçendayzer
</h2>

<button class="green" onclick="magazayaGiris()">
📍 MAĞAZAYA GİRİŞ
</button>

<div id="girisStatus"></div>

<button class="red" onclick="magazadanCixis()">
🚪 MAĞAZADAN ÇIXIŞ
</button>

<div id="cixisStatus"></div>

</div>


<div class="card">

<h2>🏪 Mağazalar</h2>

<div class="item">
<b>Bravo 5041</b><br>
Sea Breeze
</div>

<div class="item">
<b>Bravo 3077</b><br>
Sea Breeze Premium
</div>

<div class="item">
<b>Tamstore 220</b><br>
Sea Breeze
</div>

<div class="item">
<b>Bravo 4001</b><br>
Amburan
</div>

</div>


<div class="card">

<h2>📸 Şəkil</h2>

<input
type="file"
accept="image/*"
capture="environment"
>

</div>


<div class="card">

<button class="gray" onclick="cixis()">
🚪 ÇIXIŞ
</button>

</div>

</div>

</div>


<script>

function giris(){

var user =
document.getElementById("user").value;

var pass =
document.getElementById("pass").value;

if(pass !== "1234"){

document
.getElementById("error")
.classList.remove("hidden");

return;

}

document
.getElementById("error")
.classList.add("hidden");

document
.getElementById("login")
.classList.add("hidden");


if(user === "mudir"){

document
.getElementById("mudir")
.classList.remove("hidden");

}else{

document
.getElementById("mer")
.classList.remove("hidden");

document
.getElementById("merAdi")
.innerHTML =
"👤 " + user.toUpperCase();

}

}


function cixis(){

document
.getElementById("mudir")
.classList.add("hidden");

document
.getElementById("mer")
.classList.add("hidden");

document
.getElementById("login")
.classList.remove("hidden");

document
.getElementById("pass")
.value="";

document
.getElementById("mudirContent")
.innerHTML="";

}


function mercendayzerler(){

var html =
'<div class="card">'+
'<h2>👥 Merçendayzerlər</h2>';

for(var i=1;i<=11;i++){

html +=
'<div class="item">'+
'<b>Mer '+i+'</b><br>'+
'Status: Aktiv<br>'+
'Şifrə: 1234'+
'</div>';

}

html += '</div>';

document
.getElementById("mudirContent")
.innerHTML=html;

}


function magazalar(){

document
.getElementById("mudirContent")
.innerHTML=

'<div class="card">'+

'<h2>🏪 Mağazalar</h2>'+

'<div class="item"><b>Bravo 5041</b><br>Sea Breeze</div>'+

'<div class="item"><b>Bravo 3077</b><br>Sea Breeze Premium</div>'+

'<div class="item"><b>Tamstore 220</b><br>Sea Breeze</div>'+

'<div class="item"><b>Bravo 4001</b><br>Amburan</div>'+

'</div>';

}


function hesabat(){

document
.getElementById("mudirContent")
.innerHTML=

'<div class="card">'+

'<h2>📊 Hesabatlar</h2>'+

'<div class="message">'+
'Hələ hesabat yoxdur.'+
'</div>'+

'</div>';

}


function magazayaGiris(){

var saat =
new Date().toLocaleTimeString();

document
.getElementById("girisStatus")
.innerHTML=

'<div class="message success">'+
'🟢 Mağazaya giriş edildi<br>'+
'⏰ '+saat+
'</div>';

}


function magazadanCixis(){

var saat =
new Date().toLocaleTimeString();

document
.getElementById("cixisStatus")
.innerHTML=

'<div class="message error">'+
'🔴 Mağazadan çıxış edildi<br>'+
'⏰ '+saat+
'</div>';

}

</script>

</body>
</html>
