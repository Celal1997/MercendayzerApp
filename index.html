<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merçendayzer App</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f4f6;
 color:#111827
}

header{
 background:#111827;
 color:#fff;
 padding:15px;
 text-align:center;
 font-size:20px;
 font-weight:700
}

.wrap{
 max-width:900px;
 margin:auto;
 padding:15px
}

.card{
 background:#fff;
 border-radius:14px;
 padding:16px;
 margin:12px 0;
 box-shadow:0 2px 8px #0001
}

input,select,button,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 border:1px solid #d1d5db;
 border-radius:10px;
 font-size:16px
}

button{
 background:#2563eb;
 color:#fff;
 border:0;
 font-weight:700;
 cursor:pointer
}

button:active{
 opacity:.8
}

.danger{background:#dc2626}
.green{background:#16a34a}
.gray{background:#6b7280}

.hidden{
 display:none!important
}

.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.store{
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:12px;
 margin:8px 0
}

.small{
 font-size:13px;
 color:#6b7280
}

.ok{
 color:#15803d;
 font-weight:700
}

.bad{
 color:#b91c1c;
 font-weight:700
}

#msg{
 padding:10px;
 border-radius:10px;
 margin:8px 0;
 display:none
}

.loading{
 text-align:center;
 padding:15px;
 color:#6b7280
}

@media(max-width:600px){
 .row{
   grid-template-columns:1fr
 }
}
</style>
</head>

<body>

<header>📍 Merçendayzer App</header>

<div class="wrap">

<!-- LOGIN -->
<div id="login" class="card">

<h2>Giriş</h2>

<input
 id="uid"
 type="text"
 autocomplete="username"
 placeholder="İşçi ID (məs: mer1)"
>

<input
 id="pass"
 type="password"
 autocomplete="current-password"
 placeholder="Şifrə"
>

<button
 id="loginBtn"
 type="button"
 onclick="login()"
>
Daxil ol
</button>

<div id="msg"></div>

</div>


<!-- APP -->
<div id="app" class="hidden">

<div class="card">

<b id="userName"></b>

<button
 class="gray"
 type="button"
 onclick="logout()"
>
Çıxış
</button>

</div>


<!-- WORKER PANEL -->
<div id="workerPanel" class="hidden">

<div class="card">

<h3>🕐 İş vaxtı</h3>

<div id="workInfo">
<div class="loading">Yüklənir...</div>
</div>

<div class="row">

<button
 class="green"
 type="button"
 onclick="startWork()"
>
İşə başla
</button>

<button
 class="danger"
 type="button"
 onclick="endWork()"
>
İşi bitir
</button>

</div>

</div>


<!-- ROUTE -->
<div class="card">

<h3>🏪 Bugünkü mağazalar</h3>

<select
 id="day"
 onchange="loadRoute()"
>

<option value="1">1-ci gün</option>
<option value="2">2-ci gün</option>
<option value="3">3-cü gün</option>
<option value="4">4-cü gün</option>
<option value="5">5-ci gün</option>
<option value="6">6-cı gün</option>

</select>

<div id="route">
<div class="loading">Yüklənir...</div>
</div>

</div>


<!-- ACTIVE VISIT -->
<div
 id="visitCard"
 class="card hidden"
>

<h3>📍 Aktiv ziyarət</h3>

<div id="visitInfo"></div>

<button
 class="danger"
 type="button"
 onclick="finishVisit()"
>
Ziyarəti bitir
</button>

</div>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="hidden">

<div class="card">

<h3>👨‍💼 Müdir paneli</h3>

<div id="stats">
Yüklənir...
</div>

<button
 type="button"
 onclick="loadAdmin()"
>
Yenilə
</button>

</div>


<div class="card">

<h3>👥 İşçilər</h3>

<div id="workers">
Yüklənir...
</div>

</div>


<div class="card">

<h3>🏪 Mağazalar</h3>

<div class="row">

<input
 id="newChain"
 placeholder="Şəbəkə (Bravo)"
>

<input
 id="newStore"
 placeholder="Mağaza adı"
>

</div>

<div class="row">

<input
 id="newLat"
 placeholder="Latitude"
>

<input
 id="newLng"
 placeholder="Longitude"
>

</div>

<input
 id="newRadius"
 value="500"
 placeholder="Radius (metr)"
>

<button
 type="button"
 onclick="addStore()"
>
Mağaza əlavə et
</button>

<div id="stores"></div>

</div>

</div>

</div>

</div>


<script>

/* =========================
   API
========================= */

const API =
 "https://mercendayzerapp.jenaabbasov.workers.dev/api";


let user = null;
let activeWork = null;
let activeVisit = null;
let currentRoute = [];
let gpsWatch = null;


/* =========================
   MESAJ
========================= */

function showMsg(text, ok=false){

 const e =
   document.getElementById("msg");

 if(!e) return;

 e.style.display = "block";

 e.textContent = text;

 e.style.background =
   ok ? "#dcfce7" : "#fee2e2";

 e.style.color =
   ok ? "#166534" : "#991b1b";
}


/* =========================
   API REQUEST
========================= */

async function api(path, options={}){

 const config = {
   ...options,
   headers:{
     "Content-Type":"application/json",
     ...(options.headers || {})
   }
 };

 let response;

 try{

   response =
     await fetch(API + path, config);

 }catch(error){

   throw new Error(
     "Serverə qoşulmaq mümkün olmadı. İnterneti yoxlayın."
   );

 }

 let data;

 try{

   data =
     await response.json();

 }catch(error){

   throw new Error(
     "Server düzgün cavab göndərmədi."
   );

 }

 if(!response.ok){

   throw new Error(
     data.error ||
     data.message ||
     "Server xətası: " + response.status
   );

 }

 return data;
}


/* =========================
   LOGIN
========================= */

async function login(){

 const btn =
   document.getElementById("loginBtn");

 const id =
   document
     .getElementById("uid")
     .value
     .trim();

 const password =
   document
     .getElementById("pass")
     .value;


 showMsg("",true);

 if(!id){

   showMsg("İşçi ID yazın.");

   return;
 }

 if(!password){

   showMsg("Şifrə yazın.");

   return;
 }


 if(btn){

   btn.disabled = true;

   btn.textContent =
     "Giriş edilir...";
 }


 try{

   /*
      MÜDİR GİRİŞİ
      admin / 1234
   */

   if(
     id === "admin" &&
     password === "1234"
   ){

     user = {
       id:"admin",
       name:"Müdir",
       role:"admin"
     };

   }else{

     /*
       İŞÇİ GİRİŞİ
     */

     const result =
       await api(
         "/login",
         {
           method:"POST",
           body:JSON.stringify({
             id:id,
             password:password
           })
         }
       );


     if(
       !result ||
       result.success === false
     ){

       throw new Error(
         result?.error ||
         result?.message ||
         "ID və ya şifrə səhvdir."
       );

     }


     /*
       Serverdən user gəlirsə götür
     */

     user =
       result.user ||
       result.worker ||
       null;


     if(!user){

       throw new Error(
         "Server istifadəçi məlumatını göndərmədi."
       );

     }

   }


   /*
      Yadda saxla
   */

   localStorage.setItem(
     "mer_user",
     JSON.stringify(user)
   );


   /*
      Paneli aç
   */

   showApp();


 }catch(error){

   console.error(
     "LOGIN ERROR:",
     error
   );

   showMsg(
     error.message ||
     "Giriş zamanı xəta baş verdi."
   );

 }finally{

   if(btn){

     btn.disabled = false;

     btn.textContent =
       "Daxil ol";

   }

 }

}


/* =========================
   APP
========================= */

function showApp(){

 const loginBox =
   document.getElementById("login");

 const app =
   document.getElementById("app");


 if(loginBox){

   loginBox.classList.add("hidden");

 }


 if(app){

   app.classList.remove("hidden");

 }


 document
   .getElementById("userName")
   .textContent =
   "👤 " +
   (user.name || user.id);


 /*
    Köhnə panelləri gizlət
 */

 document
   .getElementById("workerPanel")
   .classList
   .add("hidden");

 document
   .getElementById("adminPanel")
   .classList
   .add("hidden");


 /*
    ADMIN
 */

 if(user.role === "admin"){

   document
     .getElementById("adminPanel")
     .classList
     .remove("hidden");

   loadAdmin();

   return;
 }


 /*
    WORKER
 */

 document
   .getElementById("workerPanel")
   .classList
   .remove("hidden");

 loadWorker();

}


/* =========================
   LOGOUT
========================= */

function logout(){

 stopGPS();

 localStorage.removeItem(
   "mer_user"
 );

 user = null;

 activeWork = null;

 activeVisit = null;

 location.reload();

}


/* =========================
   WORKER
========================= */

async function loadWorker(){

 await loadWork();

 await loadRoute();

 await loadActiveVisit();

 if(activeWork){

   startGPS();

 }

}


/* =========================
   ACTIVE WORK
========================= */

async function loadWork(){

 try{

   const result =
     await api(
       "/work/active?worker_id=" +
       encodeURIComponent(user.id)
     );


   /*
      Əsas variant
   */

   activeWork =
     result.session ||
     result.work ||
     result.data ||
     null;


   const box =
     document.getElementById(
       "workInfo"
     );


   if(!box) return;


   if(activeWork){

     box.innerHTML =
       '<span class="ok">🟢 İşdədir</span><br>' +
       'Başlanğıc: ' +
       formatDate(
         activeWork.start_time
       );

   }else{

     box.innerHTML =
       '<span class="bad">🔴 İş başlamayıb</span>';

   }


 }catch(error){

   console.error(
     "WORK ERROR:",
     error
   );


   const box =
     document.getElementById(
       "workInfo"
     );


   if(box){

     box.innerHTML =
       '<span class="bad">⚠️ ' +
       esc(error.message) +
       '</span>';

   }

 }

}


/* =========================
   İŞƏ BAŞLA
========================= */

async function startWork(){

 try{

   const p =
     await position();


   const result =
     await api(
       "/work/start",
       {
         method:"POST",

         body:JSON.stringify({

           worker_id:
             user.id,

           latitude:
             p.coords.latitude,

           longitude:
             p.coords.longitude

         })

       }
     );


   alert(
     result.message ||
     "✅ İş başladı"
   );


   await loadWork();

   startGPS();


 }catch(error){

   alert(
     "⚠️ " +
     error.message
   );

 }

}


/* =========================
   İŞİ BİTİR
========================= */

async function endWork(){

 if(!activeWork){

   alert(
     "Aktiv iş yoxdur."
   );

   return;

 }


 if(
   !confirm(
     "İşi bitirmək istəyirsiniz?"
   )
 ){

   return;

 }


 try{

   const p =
     await position();


   const result =
     await api(
       "/work/end",
       {
         method:"POST",

         body:JSON.stringify({

           worker_id:
             user.id,

           latitude:
             p.coords.latitude,

           longitude:
             p.coords.longitude

         })

       }
     );


   alert(
     result.message ||
     "✅ İş bitdi"
   );


   activeWork = null;

   stopGPS();

   await loadWork();

   await loadActiveVisit();


 }catch(error){

   alert(
     "⚠️ " +
     error.message
   );

 }

}


/* =========================
   MARŞRUT
========================= */

async function loadRoute(){

 try{

   const day =
     document
       .getElementById("day")
       .value;


   const result =
     await api(
       "/routes?worker_id=" +
       encodeURIComponent(user.id) +
       "&day=" +
       encodeURIComponent(day)
     );


   currentRoute =
     result.stores ||
     result.routes ||
     [];


   const box =
     document.getElementById(
       "route"
     );


   if(!currentRoute.length){

     box.innerHTML =
       "<p>Bu gün mağaza təyin edilməyib.</p>";

     return;

   }


   box.innerHTML =
     currentRoute
       .map(store => {

         const id =
           String(store.id ?? "");

         return `

           <div class="store">

             <b>
               ${esc(store.chain)}
               —
               ${esc(store.name)}
             </b>

             <div class="small">

               ID:
               ${esc(store.id)}

               |
               Radius:
               ${Number(store.radius || 500)}
               m

             </div>

             <button
               type="button"
               onclick="startVisitById(${JSON.stringify(id)})"
             >
               📍 Mağazaya daxil ol
             </button>

           </div>

         `;

       })
       .join("");


 }catch(error){

   console.error(
     "ROUTE ERROR:",
     error
   );


   document
     .getElementById("route")
     .innerHTML =
     '<span class="bad">⚠️ ' +
     esc(error.message) +
     '</span>';

 }

}


/* =========================
   MAĞAZAYA GİRİŞ
========================= */

function startVisitById(storeId){

 startVisit(storeId);

}


async function startVisit(storeId){

 try{

   if(!activeWork){

     alert(
       "Əvvəlcə işə başlamalısınız."
     );

     return;

   }


   const p =
     await position();


   const result =
     await api(
       "/visits/start",
       {
         method:"POST",

         body:JSON.stringify({

           worker_id:
             user.id,

           store_id:
             storeId,

           session_id:
             activeWork.id,

           latitude:
             p.coords.latitude,

           longitude:
             p.coords.longitude

         })

       }
     );


   /*
      Məsafəni göstər
   */

   if(
     result.distance !== undefined &&
     result.distance !== null
   ){

     alert(
       "📍 Məsafə: " +
       Math.round(
         Number(result.distance)
       ) +
       " m"
     );

   }else{

     alert(
       result.message ||
       "✅ Mağazaya giriş edildi."
     );

   }


   await loadActiveVisit();

   startGPS();


 }catch(error){

   alert(
     "⚠️ " +
     error.message
   );

 }

}


/* =========================
   AKTİV ZİYARƏT
========================= */

async function loadActiveVisit(){

 try{

   const result =
     await api(
       "/visits/active?worker_id=" +
       encodeURIComponent(user.id)
     );


   activeVisit =
     result.visit ||
     result.data ||
     null;


   showVisit();


 }catch(error){

   console.error(
     "ACTIVE VISIT ERROR:",
     error
   );

 }

}


/* =========================
   ZİYARƏT GÖSTƏR
========================= */

function showVisit(){

 const card =
   document.getElementById(
     "visitCard"
   );


 const info =
   document.getElementById(
     "visitInfo"
   );


 if(!card || !info) return;


 if(!activeVisit){

   card.classList.add(
     "hidden"
   );

   return;

 }


 card.classList.remove(
   "hidden"
 );


 info.innerHTML =

   "Mağaza: <b>" +
   esc(
     activeVisit.store_id
   ) +
   "</b><br>" +

   "Başlanğıc: " +

   formatDate(
     activeVisit.start_time
   );

}


/* =========================
   ZİYARƏTİ BİTİR
========================= */

async function finishVisit(){

 if(!activeVisit){

   return;

 }


 try{

   const p =
     await position();


   const note =
     prompt(
       "Qeyd (istəyə görə):"
     ) || "";


   const result =
     await api(
       "/visits/end",
       {
         method:"POST",

         body:JSON.stringify({

           worker_id:
             user.id,

           visit_id:
             activeVisit.id,

           latitude:
             p.coords.latitude,

           longitude:
             p.coords.longitude,

           note:note

         })

       }
     );


   alert(
     result.message ||
     "✅ Ziyarət tamamlandı"
   );


   activeVisit = null;

   showVisit();

   stopGPS();

   await loadRoute();


 }catch(error){

   alert(
     "⚠️ " +
     error.message
   );

 }

}


/* =========================
   GPS
========================= */

function startGPS(){

 if(!navigator.geolocation){

   console.warn(
     "Geolocation dəstəklənmir."
   );

   return;

 }


 if(gpsWatch !== null){

   return;

 }


 gpsWatch =
   navigator.geolocation.watchPosition(

     async positionData => {

       try{

         /*
            Aktiv iş yoxdursa
            GPS göndərmə
         */

         if(!user || !activeWork){

           return;

         }


         await api(
           "/gps",
           {
             method:"POST",

             body:JSON.stringify({

               worker_id:
                 user.id,

               session_id:
                 activeWork.id,

               visit_id:
                 activeVisit?.id || null,

               latitude:
                 positionData.coords.latitude,

               longitude:
                 positionData.coords.longitude,

               accuracy:
                 positionData.coords.accuracy

             })

           }
         );

       }catch(error){

         console.warn(
           "GPS server xətası:",
           error
         );

       }

     },

     error => {

       console.warn(
         "GPS ERROR:",
         error
       );

     },

     {
       enableHighAccuracy:true,
       maximumAge:10000,
       timeout:15000
     }

   );

}


/* =========================
   GPS DAYANDIR
========================= */

function stopGPS(){

 if(gpsWatch !== null){

   navigator.geolocation.clearWatch(
     gpsWatch
   );

   gpsWatch = null;

 }

}


/* =========================
   TELEFON GPS
========================= */

function position(){

 return new Promise(
   (resolve,reject)=>{

     if(!navigator.geolocation){

       reject(
         new Error(
           "Telefon GPS-i dəstəkləmir."
         )
       );

       return;

     }


     navigator.geolocation.getCurrentPosition(

       resolve,

       error => {

         let message =
           "GPS məkanı alınmadı.";


         if(
           error.code === 1
         ){

           message =
             "📍 Məkan icazəsi verilməyib. Telefonda brauzer üçün Location/Məkan icazəsini açın.";

         }else if(
           error.code === 2
         ){

           message =
             "📍 GPS məkanı müəyyən edə bilmədi. GPS-i açın və açıq yerə çıxın.";

         }else if(
           error.code === 3
         ){

           message =
             "📍 GPS cavabı gecikdi. Yenidən cəhd edin.";

         }


         reject(
           new Error(message)
         );

       },

       {
         enableHighAccuracy:true,
         timeout:15000,
         maximumAge:5000
       }

     );

   }
);


/* =========================
   ADMIN
========================= */

async function loadAdmin(){

 try{

   const [
     workersResult,
     storesResult
   ] =
     await Promise.all([

       api("/workers"),

       api("/stores")

     ]);


   const workers =
     workersResult.workers ||
     workersResult.data ||
     [];


   const stores =
     storesResult.stores ||
     storesResult.data ||
     [];


   document
     .getElementById("stats")
     .innerHTML =

     `👥 İşçi:
      <b>${workers.length}</b>
      &nbsp;&nbsp;
      🏪 Mağaza:
      <b>${stores.length}</b>`;


   document
     .getElementById("workers")
     .innerHTML =

     workers.length

     ?

     workers
       .map(worker => `

         <div class="store">

           <b>
             ${esc(worker.name)}
           </b>

           <div class="small">

             ID:
             ${esc(worker.id)}

           </div>

         </div>

       `)
       .join("")

     :

     "<p>İşçi yoxdur.</p>";


   document
     .getElementById("stores")
     .innerHTML =

     stores.length

     ?

     stores
       .map(store => `

         <div class="store">

           <b>

             ${esc(store.chain)}
             —
             ${esc(store.name)}

           </b>

           <div class="small">

             ID:
             ${esc(store.id)}

             <br>

             GPS:
             ${store.latitude ?? "-"},
             ${store.longitude ?? "-"}

             <br>

             Radius:
             ${Number(store.radius || 500)}
             m

           </div>


           <button
             class="danger"
             type="button"
             onclick="deleteStoreById(${JSON.stringify(String(store.id ?? ""))})"
           >
             🗑 Sil
           </button>

         </div>

       `)
       .join("")

     :

     "<p>Mağaza yoxdur.</p>";


 }catch(error){

   console.error(
     "ADMIN ERROR:",
     error
   );


   document
     .getElementById("stats")
     .innerHTML =
     '<span class="bad">⚠️ ' +
     esc(error.message) +
     '</span>';

 }

}


/* =========================
   MAĞAZA ƏLAVƏ ET
========================= */

async function addStore(){

 try{

   const chain =
     document
       .getElementById("newChain")
       .value
       .trim();


   const name =
     document
       .getElementById("newStore")
       .value
       .trim();


   const lat =
     parseFloat(
       document
         .getElementById("newLat")
         .value
     );


   const lng =
     parseFloat(
       document
         .getElementById("newLng")
         .value
     );


   const radius =
     parseInt(
       document
         .getElementById("newRadius")
         .value
     ) || 500;


   if(!chain){

     throw new Error(
       "Şəbəkə adı yazılmalıdır."
     );

   }


   if(!name){

     throw new Error(
       "Mağaza adı yazılmalıdır."
     );

   }


   const id =
     Date.now().toString();


   await api(
     "/stores",
     {
       method:"POST",

       body:JSON.stringify({

         id:id,

         chain:chain,

         name:name,

         latitude:
           Number.isFinite(lat)
           ? lat
           : null,

         longitude:
           Number.isFinite(lng)
           ? lng
           : null,

         radius:radius

       })

     }
   );

/* =========================
   HTML TƏHLÜKƏSİZLİYİ
========================= */

function esc(value){

 return String(
   value ?? ""
 ).replace(
   /[&<>"']/g,
   character => ({

     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#039;"

   }[character])
 );

}


/* =========================
   TARİX
========================= */

function formatDate(value){

 if(!value){

   return "-";

 }

 const date =
   new Date(value);


 if(
   Number.isNaN(
     date.getTime()
   )
 ){

   return String(value);

 }


 return date.toLocaleString(
   "az-AZ"
 );

}
