<style>
* {

body {

.header {

}

.container {

    max-width: 500px;

}

.card {

    border-radius: 16px;
    padding: 22px;

}

h2 {
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 14px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

button {
    width: 100%;
    border: none;
    border-radius: 10px;
    padding: 14px;
    margin-top: 15px;
    font-size: 17px;
    font-weight: bold;
    color: white;
    background: #1769aa;
}

button:active {
    opacity: 0.8;
}

.green {
    background: #2e7d32;
}

.red {
    background: #c62828;
}

.gray {
    background: #555;
}

.hidden {
    display: none;
}

.error {
    color: #d00000;
    text-align: center;
    font-weight: bold;
    margin-top: 12px;
}

.success {

.worker {

}

.store {
    background: #f8f8f8;
    padding: 15px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

.info {
    background: #eef5ff;
    padding: 14px;
    border-radius: 10px;
    margin-top: 12px;
}
</style>
</head>

   GİRİŞ
========================= */

function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const user = users[username];

    if (!user || password !== user.password) {

        document
            .getElementById("loginError")
            .classList.remove("hidden");

        return;
    }

    document
        .getElementById("loginError")
        .classList.add("hidden");

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    if (user.type === "admin") {

        document
            .getElementById("adminScreen")
            .classList.remove("hidden");

    } else {

        document
            .getElementById("workerScreen")
            .classList.remove("hidden");

        document
            .getElementById("workerName")
            .innerText = "👤 " + user.name;
    }
}
