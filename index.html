<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merçendayzer App</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

header{
  background:#111827;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:700;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 8px #0001;
}

input,
select,
button,
textarea{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
}

button{
  background:#2563eb;
  color:#fff;
  border:0;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.danger{
  background:#dc2626;
}

.green{
  background:#16a34a;
}

.gray{
  background:#6b7280;
}

.orange{
  background:#ea580c;
}

.hidden{
  display:none!important;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.store{
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
  margin:8px 0;
  background:#fff;
}

.small{
  font-size:13px;
  color:#6b7280;
  margin-top:5px;
}

.ok{
  color:#15803d;
  font-weight:700;
}

.bad{
  color:#b91c1c;
  font-weight:700;
}

.title{
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

.distance{
  font-size:15px;
  font-weight:700;
  margin:8px 0;
}

#msg{
  padding:10px;
  border-radius:10px;
  margin:8px 0;
  display:none;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f9fafb;
  border-radius:12px;
  padding:14px;
  text-align:center;
  border:1px solid #e5e7eb;
}

.stat b{
  display:block;
  font-size:24px;
  margin-top:5px;
}

.photo-preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  border-radius:10px;
  margin-top:8px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  background:#e5e7eb;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-red{
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:600px){
  .row{
    grid-template-columns:1fr;
  }

  .stat-grid{
    grid-template-columns:1fr 1fr;
  }

  header{
    font-size:18px;
  }
}
</style>
</head>

<body>

<header>
📍 Merçendayzer App
</header>

<div class="wrap">

<!-- LOGIN -->
<div id="login" class="card">

  <div class="title">
    🔐 Sistemə giriş
  </div>

  <input
    id="uid"
    type="text"
    placeholder="İşçi ID (məs: mer1)"
    autocomplete="username"
  >

  <input
    id="pass"
    type="password"
    placeholder="Şifrə"
    autocomplete="current-password"
  >

  <button onclick="login()">
    Daxil ol
  </button>

  <div id="msg"></div>

</div>


<!-- APPLICATION -->
<div id="app" class="hidden">

  <!-- USER HEADER -->
  <div class="card">

    <div class="title">
      👤 <span id="userName"></span>
    </div>

    <button
      class="gray"
      onclick="logout()"
    >
      Çıxış
    </button>

  </div>


  <!-- WORKER PANEL -->
  <div id="workerPanel" class="hidden">

    <!-- WORK STATUS -->
    <div class="card">

      <div class="title">
        🕐 İş vaxtı
      </div>

      <div id="workInfo">
        Yüklənir...
      </div>

      <div class="row">

        <button
          class="green"
          onclick="startWork()"
        >
          🟢 İşə başla
        </button>

        <button
          class="danger"
          onclick="endWork()"
        >
          🔴 İşi bitir
        </button>

      </div>

    </div>


    <!-- ROUTE -->
    <div class="card">

      <div class="title">
        🏪 Bugünkü mağazalar
      </div>

      <select
        id="day"
        onchange="loadRoute()"
      >
        <option value="1">
          1-ci gün
        </option>

        <option value="2">
          2-ci gün
        </option>

        <option value="3">
          3-cü gün
        </option>

        <option value="4">
          4-cü gün
        </option>

        <option value="5">
          5-ci gün
        </option>

        <option value="6">
          6-cı gün
        </option>
      </select>

      <div id="route">
        Yüklənir...
      </div>

    </div>


    <!-- ACTIVE VISIT -->
    <div
      id="visitCard"
      class="card hidden"
    >

      <div class="title">
        📍 Aktiv mağaza ziyarəti
      </div>

      <div id="visitInfo"></div>

      <div
        id="visitDistance"
        class="distance"
      ></div>

      <!-- PHOTO -->
      <div class="card">

        <b>📷 Mağaza şəkli</b>

        <input
          id="visitPhoto"
          type="file"
          accept="image/*"
          capture="environment"
          onchange="previewPhoto(event)"
        >

        <img
          id="photoPreview"
          class="photo-preview hidden"
        >

        <button
          class="orange"
          onclick="uploadVisitPhoto()"
        >
          📤 Şəkli göndər
        </button>

      </div>


      <!-- CHECKS -->
      <div class="card">

        <b>✅ Məhsul yoxlaması</b>

        <input
          id="productName"
          placeholder="Məhsul adı"
        >

        <button
          onclick="saveCheck()"
        >
          Yoxlamanı yadda saxla
        </button>

        <div id="checks"></div>

      </div>


      <textarea
        id="visitNote"
        placeholder="Qeyd..."
      ></textarea>

      <button
        class="danger"
        onclick="finishVisit()"
      >
        🔴 Ziyarəti bitir
      </button>

    </div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">

    <div class="card">

      <div class="title">
        👨‍💼 Müdir paneli
      </div>

      <div
        id="stats"
        class="stat-grid"
      >
        Yüklənir...
      </div>

      <button onclick="loadAdmin()">
        🔄 Yenilə
      </button>

    </div>


    <!-- WORKERS -->
    <div class="card">

      <div class="title">
        👥 Merçendayzerlər
      </div>

      <div id="workers">
        Yüklənir...
      </div>

    </div>


    <!-- STORES -->
    <div class="card">

      <div class="title">
        🏪 Mağazalar
      </div>

      <div class="row">

        <input
          id="newChain"
          placeholder="Şəbəkə (məs: Bravo)"
        >

        <input
          id="newStore"
          placeholder="Mağaza adı"
        >

      </div>

      <div class="row">

        <input
          id="newLat"
          placeholder="Latitude"
        >

        <input
          id="newLng"
          placeholder="Longitude"
        >

      </div>

      <input
        id="newRadius"
        value="500"
        placeholder="Radius (metr)"
      >

      <button onclick="addStore()">
        ➕ Mağaza əlavə et
      </button>

      <div id="stores">
        Yüklənir...
      </div>

    </div>

  </div>

</div>

</div>

<script>

const API="/api";

let user=null;

let activeWork=null;

let activeVisit=null;

let currentRoute=[];

let gpsWatch=null;

let selectedPhoto=null;


/* =========================
   MESSAGE
========================= */

function showMsg(text,ok=false){

  const el=document.getElementById("msg");

  el.style.display="block";

  el.textContent=text;

  el.style.background=ok
    ? "#dcfce7"
    : "#fee2e2";

  el.style.color=ok
    ? "#166534"
    : "#991b1b";
}


/* =========================
   API
========================= */

async function api(path,opt={}){

  const options={
    ...opt,
    headers:{
      "Content-Type":"application/json",
      ...(opt.headers||{})
    }
  };

  const response=
    await fetch(API+path,options);

  const data=
    await response.json()
      .catch(()=>({
        success:false,
        error:"Server cavabı oxunmadı"
      }));

  if(!response.ok){

    throw new Error(
      data.error ||
      "Server xətası"
    );

  }

  return data;
}


/* =========================
   LOGIN
========================= */

async function login(){

  try{

    const id=
      document.getElementById("uid")
      .value
      .trim();

    const password=
      document.getElementById("pass")
      .value;

    if(!id){

      showMsg("İşçi ID yazın.");

      return;

    }

    if(!password){

      showMsg("Şifrə yazın.");

      return;

    }


    /*
      Müdir üçün giriş
    */

    if(
      id==="admin" &&
      password==="1234"
    ){

      user={
        id:"admin",
        name:"Müdir",
        role:"admin"
      };

    }else{

      const result=
        await api(
          "/login",
          {
            method:"POST",
            body:JSON.stringify({
              id:id,
              password:password
            })
          }
        );

      if(!result.success){

        throw new Error(
          result.error ||
          "Giriş mümkün olmadı"
        );

      }

      user=result.user;

    }


    localStorage.setItem(
      "mer_user",
      JSON.stringify(user)
    );

    showApp();

  }catch(error){

    showMsg(error.message);

  }

}


/* =========================
   SHOW APP
========================= */

function showApp(){

  document
    .getElementById("login")
    .classList
    .add("hidden");

  document
    .getElementById("app")
    .classList
    .remove("hidden");

  document
    .getElementById("userName")
    .textContent=user.name;


  if(user.role==="admin"){

    document
      .getElementById("adminPanel")
      .classList
      .remove("hidden");

    loadAdmin();

  }else{

    document
      .getElementById("workerPanel")
      .classList
      .remove("hidden");

    loadWorker();

  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  localStorage.removeItem(
    "mer_user"
  );

  stopGPS();

  location.reload();

}


/* =========================
   WORKER LOAD
========================= */

async function loadWorker(){

  await loadWork();

  await loadRoute();

  await loadActiveVisit();

}


/* =========================
   WORK STATUS
========================= */

async function loadWork(){

  try{

    const result=
      await api(
        "/work/active?worker_id="+
        encodeURIComponent(user.id)
      );

    activeWork=
      result.work || null;

    const info=
      document.getElementById(
        "workInfo"
      );


    if(activeWork){

      info.innerHTML=`
        <span class="ok">
          🟢 Hazırda işdədir
        </span>
        <br>
        Başlanğıc:
        ${formatDate(activeWork.start_time)}
      `;

    }else{

      info.innerHTML=`
        <span class="bad">
          🔴 İş başlamayıb
        </span>
      `;

    }

  }catch(error){

    document
      .getElementById("workInfo")
      .textContent=
      error.message;

  }

}


/* =========================
   START WORK
========================= */

async function startWork(){

  try{

    const p=
      await getPosition();

    const result=
      await api(
        "/work/start",
        {
          method:"POST",
          body:JSON.stringify({
            worker_id:user.id,
            lat:p.coords.latitude,
            lng:p.coords.longitude
          })
        }
      );

    alert(
      result.message ||
      "İş başladı"
    );

    await loadWork();

    startGPS();

  }catch(error){

    alert(error.message);

  }

}


/* =========================
   END WORK
========================= */

async function endWork(){

  if(
    !confirm(
      "İşi bitirmək istəyirsiniz?"
    )
  ){

    return;

  }

  try{

    const p=
      await getPosition();

    const result=
      await api(
        "/work/end",
        {
          method:"POST",
          body:JSON.stringify({
            worker_id:user.id,
            lat:p.coords.latitude,
            lng:p.coords.longitude
          })
        }
      );

    alert(
      result.message ||
      "İş bitdi"
    );

    activeWork=null;

    stopGPS();

    await loadWork();

  }catch(error){

    alert(error.message);

  }

}


/* =========================
   ROUTE
========================= */

async function loadRoute(){

  try{

    const day=
      document.getElementById(
        "day"
      ).value;

    const result=
      await api(
        "/routes?worker_id="+
        encodeURIComponent(user.id)+
        "&day="+
        encodeURIComponent(day)
      );

    currentRoute=
      result.stores || [];

    const box=
      document.getElementById(
        "route"
      );


    if(!currentRoute.length){

      box.innerHTML=
        "<p>Bu gün üçün mağaza təyin edilməyib.</p>";

      return;

    }


    box.innerHTML=
      currentRoute
      .map((store,index)=>`

        <div class="store">

          <b>
            ${index+1}.
            ${esc(store.chain)}
            —
            ${esc(store.name)}
          </b>

          <div class="small">
            ID:
            ${esc(store.id)}
          </div>

          <div class="small">
            Radius:
            ${store.radius || 500}
            metr
          </div>

          <button
            onclick="startVisit('${escAttr(store.id)}')"
          >
            📍 Mağazaya daxil ol
          </button>

        </div>

      `)
      .join("");

  }catch(error){

    document
      .getElementById("route")
      .textContent=
      error.message;

  }

}


/* =========================
   START VISIT
========================= */

async function startVisit(storeId){

  try{

    if(!activeWork){

      alert(
        "Əvvəlcə işə başlamalısınız."
      );

      return;

    }

    const p=
      await getPosition();

    const result=
      await api(
        "/visits/start",
        {
          method:"POST",
          body:JSON.stringify({

            worker_id:user.id,

            store_id:storeId,

            session_id:activeWork.id,

            lat:p.coords.latitude,

            lng:p.coords.longitude

          })
        }
      );


    if(
      result.distance !== undefined
    ){

      alert(
        "Mağazaya məsafə: "+
        Math.round(result.distance)+
        " metr"
      );

    }


    activeVisit=
      result.visit;

    showVisit();

    startGPS();

    loadChecks();

    loadPhotos();

  }catch(error){

    alert(error.message);

  }

}
 /* =========================
   ACTIVE VISIT
========================= */

async function loadActiveVisit(){

  try{

    const result=
      await api(
        "/visits/active?worker_id="+
        encodeURIComponent(user.id)
      );

    activeVisit=
      result.visit || null;

    showVisit();

    if(activeVisit){

      startGPS();

      loadChecks();

      loadPhotos();

    }

  }catch(error){

    console.log(
      "Aktiv ziyarət yoxdur:",
      error.message
    );

  }

}


/* =========================
   SHOW ACTIVE VISIT
========================= */

function showVisit(){

  const card=
    document.getElementById(
      "visitCard"
    );

  if(!activeVisit){

    card.classList.add(
      "hidden"
    );

    return;

  }


  card.classList.remove(
    "hidden"
  );


  document.getElementById(
    "visitInfo"
  ).innerHTML=`

    <div class="store">

      <b>
        🏪 Mağaza:
      </b>

      <br>

      ${esc(
        activeVisit.store_id
      )}

      <div class="small">

        Başlanğıc:
        ${formatDate(
          activeVisit.start_time
        )}

      </div>

    </div>

  `;

}


/* =========================
   FINISH VISIT
========================= */

async function finishVisit(){

  if(!activeVisit){

    return;

  }


  try{

    const p=
      await getPosition();


    const note=
      document.getElementById(
        "visitNote"
      ).value.trim();


    const result=
      await api(
        "/visits/end",
        {
          method:"POST",

          body:JSON.stringify({

            worker_id:user.id,

            visit_id:activeVisit.id,

            lat:p.coords.latitude,

            lng:p.coords.longitude,

            note:note

          })

        }
      );


    alert(
      result.message ||
      "Ziyarət tamamlandı"
    );


    activeVisit=null;

    document.getElementById(
      "visitNote"
    ).value="";


    document.getElementById(
      "visitPhoto"
    ).value="";


    document.getElementById(
      "photoPreview"
    ).classList.add(
      "hidden"
    );


    stopGPS();

    showVisit();

    loadRoute();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   GPS WATCH
========================= */

function startGPS(){

  if(
    !navigator.geolocation
  ){

    return;

  }


  if(
    gpsWatch !== null
  ){

    return;

  }


  gpsWatch=
    navigator.geolocation
    .watchPosition(

      async position=>{

        try{

          await api(
            "/gps",
            {
              method:"POST",

              body:JSON.stringify({

                worker_id:
                  user.id,

                session_id:
                  activeWork?.id ||
                  null,

                visit_id:
                  activeVisit?.id ||
                  null,

                latitude:
                  position.coords.latitude,

                longitude:
                  position.coords.longitude,

                accuracy:
                  position.coords.accuracy

              })

            }
          );

        }catch(error){

          console.log(
            "GPS göndərilmədi",
            error.message
          );

        }

      },

      error=>{

        console.log(
          "GPS xətası:",
          error.message
        );

      },

      {

        enableHighAccuracy:true,

        maximumAge:10000,

        timeout:15000

      }

    );

}


/* =========================
   STOP GPS
========================= */

function stopGPS(){

  if(
    gpsWatch !== null
  ){

    navigator
      .geolocation
      .clearWatch(
        gpsWatch
      );

    gpsWatch=null;

  }

}


/* =========================
   GET PHONE GPS
========================= */

function getPosition(){

  return new Promise(
    (resolve,reject)=>{

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            "Telefon GPS-i dəstəkləmir."
          )
        );

        return;

      }


      navigator
        .geolocation
        .getCurrentPosition(

          resolve,

          error=>{

            let text=
              "GPS alınmadı.";

            if(
              error.code===1
            ){

              text=
                "GPS icazəsi verilməyib. Telefonun məkan icazəsini açın.";

            }

            if(
              error.code===2
            ){

              text=
                "Məkan müəyyən edilə bilmədi.";

            }

            if(
              error.code===3
            ){

              text=
                "GPS vaxtı keçdi. Açıq havada yenidən yoxlayın.";

            }

            reject(
              new Error(text)
            );

          },

          {

            enableHighAccuracy:true,

            timeout:15000,

            maximumAge:5000

          }

        );

    }
  );

}


/* =========================
   PHOTO PREVIEW
========================= */

function previewPhoto(event){

  const file=
    event.target.files?.[0];


  if(!file){

    selectedPhoto=null;

    document
      .getElementById(
        "photoPreview"
      )
      .classList
      .add("hidden");

    return;

  }


  selectedPhoto=file;


  const url=
    URL.createObjectURL(
      file
    );


  const img=
    document.getElementById(
      "photoPreview"
    );


  img.src=url;

  img.classList.remove(
    "hidden"
  );

}


/* =========================
   PHOTO UPLOAD
========================= */

async function uploadVisitPhoto(){

  try{

    if(!activeVisit){

      alert(
        "Aktiv mağaza ziyarəti yoxdur."
      );

      return;

    }


    if(!selectedPhoto){

      const input=
        document.getElementById(
          "visitPhoto"
        );

      const file=
        input.files?.[0];

      if(file){

        selectedPhoto=file;

      }

    }


    if(!selectedPhoto){

      alert(
        "Əvvəlcə şəkil çəkin və ya seçin."
      );

      return;

    }


    /*
      Şəkli base64-ə çeviririk.
      Worker bunu D1-də visit_photos
      cədvəlinə yazır.
    */

    const base64=
      await fileToBase64(
        selectedPhoto
      );


    const result=
      await api(
        "/photos",
        {
          method:"POST",

          body:JSON.stringify({

            visit_id:
              activeVisit.id,

            photo_url:
              base64

          })

        }
      );


    alert(
      result.message ||
      "Şəkil göndərildi."
    );


    loadPhotos();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   FILE -> BASE64
========================= */

function fileToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader=
        new FileReader();


      reader.onload=()=>{
        resolve(
          reader.result
        );
      };


      reader.onerror=
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   LOAD PHOTOS
========================= */

async function loadPhotos(){

  if(!activeVisit){

    return;

  }


  try{

    const result=
      await api(
        "/photos?visit_id="+
        encodeURIComponent(
          activeVisit.id
        )
      );


    const photos=
      result.photos || [];


    const preview=
      document.getElementById(
        "photoPreview"
      );


    /*
      Son şəkli göstəririk.
    */

    if(photos.length){

      const last=
        photos[
          photos.length-1
        ];


      if(last.photo_url){

        preview.src=
          last.photo_url;

        preview.classList.remove(
          "hidden"
        );

      }

    }

  }catch(error){

    console.log(
      "Şəkillər alınmadı:",
      error.message
    );

  }

}


/* =========================
   PRODUCT CHECK
========================= */

async function saveCheck(){

  try{

    if(!activeVisit){

      alert(
        "Aktiv ziyarət yoxdur."
      );

      return;

    }


    const input=
      document.getElementById(
        "productName"
      );


    const product=
      input.value.trim();


    if(!product){

      alert(
        "Məhsul adını yazın."
      );

      return;

    }


    await api(
      "/checks",
      {
        method:"POST",

        body:JSON.stringify({

          visit_id:
            activeVisit.id,

          product_name:
            product,

          checked:1

        })

      }
    );


    input.value="";


    alert(
      "Məhsul yoxlanıldı."
    );


    loadChecks();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   LOAD CHECKS
========================= */

async function loadChecks(){

  if(!activeVisit){

    return;

  }


  try{

    const result=
      await api(
        "/checks?visit_id="+
        encodeURIComponent(
          activeVisit.id
        )
      );


    const checks=
      result.checks || [];


    const box=
      document.getElementById(
        "checks"
      );


    if(!checks.length){

      box.innerHTML=
        '<div class="small">Hələ məhsul yoxlanmayıb.</div>';

      return;

    }


    box.innerHTML=
      checks
      .map(
        (item,index)=>`

          <div class="store">

            ${index+1}.
            <b>
              ${esc(
                item.product_name
              )}
            </b>

            <span class="badge badge-green">
              ✓ Yoxlanılıb
            </span>

          </div>

        `
      )
      .join("");


  }catch(error){

    console.log(
      "Yoxlamalar alınmadı:",
      error.message
    );

  }

}


/* =========================
   ADMIN PANEL
========================= */

async function loadAdmin(){

  try{

    const [
      workersResult,
      storesResult
    ]=
      await Promise.all([

        api("/workers"),

        api("/stores")

      ]);


    const workers=
      workersResult.workers || [];


    const stores=
      storesResult.stores || [];


    document.getElementById(
      "stats"
    ).innerHTML=`

      <div class="stat">

        👥

        <b>
          ${workers.length}
        </b>

        İşçi

      </div>


      <div class="stat">

        🏪

        <b>
          ${stores.length}
        </b>

        Mağaza

      </div>


      <div class="stat">

        📍

        <b>
          ${stores.filter(
            s =>
              s.latitude !== null &&
              s.longitude !== null
          ).length
        }</b>

        GPS-li

      </div>

    `;


    document.getElementById(
      "workers"
    ).innerHTML=

      workers
      .map(worker=>`

        <div class="store">

          <b>
            ${esc(
              worker.name
            )}
          </b>

          <div class="small">

            ID:
            ${esc(worker.id)}

          </div>

          <span class="badge ${
            worker.active
              ? "badge-green"
              : "badge-red"
          }">

            ${
              worker.active
                ? "Aktiv"
                : "Deaktiv"
            }

          </span>

        </div>

      `)
      .join("");


    document.getElementById(
      "stores"
    ).innerHTML=

      stores
      .map(store=>`

        <div class="store">

          <b>
            ${esc(store.chain)}
            —
            ${esc(store.name)}
          </b>

          <div class="small">

            ID:
            ${esc(store.id)}

          </div>

          <div class="small">

            GPS:
            ${
              store.latitude ??
              "-"
            },

            ${
              store.longitude ??
              "-"
            }

          </div>

          <div class="small">

            Radius:
            ${
              store.radius ||
              500
            }
            metr

          </div>

          <button
            class="danger"
            onclick="deleteStore('${escAttr(store.id)}')"
          >

            🗑 Mağazanı sil

          </button>

        </div>

      `)
      .join("");


  }catch(error){

    document.getElementById(
      "stats"
    ).innerHTML=
      `<div class="bad">
        ${esc(error.message)}
      </div>`;

  }

}


/* =========================
   ADD STORE
========================= */

async function addStore(){

  try{

    const chain=
      document
      .getElementById(
        "newChain"
      )
      .value
      .trim();


    const name=
      document
      .getElementById(
        "newStore"
      )
      .value
      .trim();


    const latText=
      document
      .getElementById(
        "newLat"
      )
      .value
      .trim();


    const lngText=
      document
      .getElementById(
        "newLng"
      )
      .value
      .trim();


    const radius=
      parseInt(
        document
        .getElementById(
          "newRadius"
        )
        .value
      ) || 500;


    if(!chain){

      alert(
        "Şəbəkə adını yazın."
      );

      return;

    }


    if(!name){

      alert(
        "Mağaza adını yazın."
      );

      return;

    }


    const latitude=
      latText
        ? parseFloat(latText)
        : null;


    const longitude=
      lngText
        ? parseFloat(lngText)
        : null;


    const id=
      "store_"+Date.now();


    await api(
      "/stores",
      {
        method:"POST",

        body:JSON.stringify({

          id:id,

          chain:chain,

          name:name,

          latitude:
            Number.isFinite(
              latitude
            )
              ? latitude
              : null,

          longitude:
            Number.isFinite(
              longitude
            )
              ? longitude
              : null,

          radius:radius

        })

      }
    );


    alert(
      "Mağaza əlavə edildi."
    );


    document.getElementById(
      "newChain"
    ).value="";


    document.getElementById(
      "newStore"
    ).value="";


    document.getElementById(
      "newLat"
    ).value="";


    document.getElementById(
      "newLng"
    ).value="";


    loadAdmin();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   DELETE STORE
========================= */

async function deleteStore(id){

  if(
    !confirm(
      "Bu mağazanı silmək istəyirsiniz?"
    )
  ){

    return;

  }


  try{

    await api(
      "/stores/"+encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );


    alert(
      "Mağaza silindi."
    );


    loadAdmin();


  }catch(error){

    alert(
      error.message
    );

  }

}


/* =========================
   HELPERS
========================= */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    char=>({

      "&":"&amp;",

      "<":"&lt;",

      ">":"&gt;",

      '"':"&quot;",

      "'":"&#039;"

    }[char])

  );

}


function escAttr(value){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}


function formatDate(value){

  if(!value){

    return "-";

  }


  try{

    return new Date(
      value
    ).toLocaleString(
      "az-AZ"
    );

  }catch(error){

    return value;

  }

}
