<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merçendayzer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f7;
}

.header {
    background: #1769aa;
    color: white;
    text-align: center;
    padding: 22px 10px;
    font-size: 25px;
    font-weight: bold;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 22px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.12);
}

h2 {
    text-align: center;
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
}

select,
input {
    width: 100%;
    padding: 14px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 17px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 15px;
    border: 0;
    border-radius: 10px;
    background: #1769aa;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

.green {
    background: #2e7d32;
}

.red {
    background: #c62828;
}

.hidden {
    display: none;
}

.error {
    color: #d00000;
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
}

.success {
    color: #2e7d32;
    text-align: center;
    font-weight: bold;
    margin-top: 15px;
}

.info {
    background: #eef5ff;
    padding: 14px;
    border-radius: 10px;
    margin-top: 10px;
}

.item {
    background: #f7f7f7;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
}
</style>
</head>

<body>

<div class="header">
    MERÇENDAYZER
</div>

<div class="container">

    <!-- GİRİŞ -->
    <div id="login" class="card">

        <h2>🔐 Giriş</h2>

        <label>İstifadəçi</label>

        <select id="user">
            <option value="mudir">Müdir</option>
            <option value="mer1">Mer 1</option>
            <option value="mer2">Mer 2</option>
            <option value="mer3">Mer 3</option>
            <option value="mer4">Mer 4</option>
            <option value="mer5">Mer 5</option>
            <option value="mer6">Mer 6</option>
            <option value="mer7">Mer 7</option>
            <option value="mer8">Mer 8</option>
            <option value="mer9">Mer 9</option>
            <option value="mer10">Mer 10</option>
            <option value="mer11">Mer 11</option>
        </select>

        <label>Şifrə</label>

        <input
            id="password"
            type="password"
            placeholder="1234"
            inputmode="numeric"
        >

        <button onclick="login()">
            DAXİL OL
        </button>

        <div id="error" class="error hidden">
            Şifrə yanlışdır!
        </div>

    </div>


    <!-- MÜDİR PANELİ -->
    <div id="admin" class="hidden">

        <div class="card">

            <h2>👨‍💼 Müdir Paneli</h2>

            <div class="info">
                Müdir hesabına daxil oldunuz.
            </div>

            <button onclick="workers()">
                👥 Merçendayzerlər
            </button>

            <button onclick="stores()">
                🏪 Mağazalar
            </button>

            <button onclick="reports()">
                📊 Hesabatlar
            </button>

            <button class="red" onclick="logout()">
                ÇIXIŞ
            </button>

        </div>

        <div id="adminContent"></div>

    </div>


    <!-- MER PANELİ -->
    <div id="worker" class="hidden">

        <div class="card">

            <h2 id="workerTitle">
                Merçendayzer
            </h2>

            <div class="info">
                Mağazaya daxil olduğunuz zaman
                "Mağazaya giriş" düyməsini basın.
            </div>

            <button class="green" onclick="enterStore()">
                📍 MAĞAZAYA GİRİŞ
            </button>

            <div id="entry" class="success"></div>

            <button class="red" onclick="exitStore()">
                🚪 MAĞAZADAN ÇIXIŞ
            </button>
