<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merçendayzer App</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f4f6;
 color:#111827
}
header{
 background:#111827;
 color:#fff;
 padding:15px;
 text-align:center;
 font-size:20px;
 font-weight:700
}
.wrap{
 max-width:900px;
 margin:auto;
 padding:15px
}
.card{
 background:#fff;
 border-radius:14px;
 padding:16px;
 margin:12px 0;
 box-shadow:0 2px 8px #0001
}
input,select,button,textarea{
 width:100%;
 padding:12px;
 margin:6px 0;
 border:1px solid #d1d5db;
 border-radius:10px;
 font-size:16px
}
button{
 background:#2563eb;
 color:#fff;
 border:0;
 font-weight:700
}
.danger{background:#dc2626}
.green{background:#16a34a}
.gray{background:#6b7280}
.hidden{display:none}
.row{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}
.store{
 border:1px solid #e5e7eb;
 border-radius:12px;
 padding:12px;
 margin:8px 0
}
.small{
 font-size:13px;
 color:#6b7280
}
.ok{
 color:#15803d;
 font-weight:700
}
.bad{
 color:#b91c1c;
 font-weight:700
}
#msg{
 padding:10px;
 border-radius:10px;
 margin:8px 0;
 display:none
}
@media(max-width:600px){
 .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>📍 Merçendayzer App</header>

<div class="wrap">

<!-- GİRİŞ -->
<div id="login" class="card">
<h2>Giriş</h2>

<input id="uid" placeholder="İşçi ID (məs: mer1)">
<input id="pass" type="password" placeholder="Şifrə">

<button onclick="login()">Daxil ol</button>

<div id="msg"></div>
</div>


<!-- ƏSAS APP -->
<div id="app" class="hidden">

<div class="card">
<b id="userName"></b>
<button class="gray" onclick="logout()">Çıxış</button>
</div>


<!-- İŞÇİ PANELİ -->
<div id="workerPanel" class="hidden">

<div class="card">

<h3>🕐 İş vaxtı</h3>

<div id="workInfo">
Yüklənir...
</div>

<div class="row">

<button class="green" onclick="startWork()">
İşə başla
</button>

<button class="danger" onclick="endWork()">
İşi bitir
</button>

</div>

</div>


<!-- MAĞAZALAR -->
<div class="card">

<h3>🏪 Bugünkü mağazalar</h3>

<select id="day" onchange="loadRoute()">

<option value="1">1-ci gün</option>
<option value="2">2-ci gün</option>
<option value="3">3-cü gün</option>
<option value="4">4-cü gün</option>
<option value="5">5-ci gün</option>
<option value="6">6-cı gün</option>

</select>

<div id="route">
Yüklənir...
</div>

</div>


<!-- AKTİV ZİYARƏT -->
<div id="visitCard" class="card hidden">

<h3>📍 Aktiv ziyarət</h3>

<div id="visitInfo"></div>

<button class="danger" onclick="finishVisit()">
Ziyarəti bitir
</button>

</div>

</div>


<!-- MÜDİR PANELİ -->
<div id="adminPanel" class="hidden">

<div class="card">

<h3>👨‍💼 Müdir paneli</h3>

<div id="stats"></div>

<button onclick="loadAdmin()">
Yenilə
</button>

</div>


<div class="card">

<h3>👥 İşçilər</h3>

<div id="workers"></div>

</div>


<div class="card">

<h3>🏪 Mağazalar</h3>

<div class="row">

<input id="newChain" placeholder="Şəbəkə (Bravo)">

<input id="newStore" placeholder="Mağaza adı">

</div>

<div class="row">

<input id="newLat" placeholder="Latitude">

<input id="newLng" placeholder="Longitude">

</div>

<input
 id="newRadius"
 value="500"
 placeholder="Radius (metr)"
>

<button onclick="addStore()">
Mağaza əlavə et
</button>

<div id="stores"></div>

</div>

</div>

</div>

</div>


<script>

const API="https://mercendayzerapp.jenaabbasov.workers.dev/api";

let user=null;
let activeWork=null;
let activeVisit=null;
let currentRoute=[];


/* MESAJ */

function showMsg(t,ok=false){

 const e=document.getElementById("msg");

 e.style.display="block";

 e.textContent=t;

 e.style.background=ok?"#dcfce7":"#fee2e2";

 e.style.color=ok?"#166534":"#991b1b";

}


/* API */

async function api(path,opt={}){

 const r=await fetch(
   API+path,
   {
     headers:{
       "Content-Type":"application/json"
     },
     ...opt
   }
 );

 const j=await r.json().catch(()=>({
   success:false,
   error:"Server cavabı oxunmadı"
 }));

 if(!r.ok){

   throw new Error(
     j.error ||
     j.message ||
     "Xəta baş verdi"
   );

 }

 return j;

}


/* LOGIN */

async function login(){

 try{

   const id=
     document.getElementById("uid")
     .value
     .trim();

   const password=
     document.getElementById("pass")
     .value;


   if(id==="admin" && password==="1234"){

     user={
       id:"admin",
       name:"Müdir",
       role:"admin"
     };

   }else{

     const j=await api(
       "/login",
       {
         method:"POST",
         body:JSON.stringify({
           id,
           password
         })
       }
     );

     if(!j.success){

       throw new Error(
         j.error ||
         "Giriş mümkün olmadı"
       );

     }

     user=j.user;

   }


   localStorage.setItem(
     "mer_user",
     JSON.stringify(user)
   );

   showApp();


 }catch(e){

   showMsg(e.message);

 }

}


/* APP */

function showApp(){

 document
   .getElementById("login")
   .classList
   .add("hidden");

 document
   .getElementById("app")
   .classList
   .remove("hidden");


 document
   .getElementById("userName")
   .textContent=
   "👤 "+user.name;


 if(user.role==="admin"){

   document
     .getElementById("adminPanel")
     .classList
     .remove("hidden");

   loadAdmin();

 }else{

   document
     .getElementById("workerPanel")
     .classList
     .remove("hidden");

   loadWorker();

 }

}


/* LOGOUT */

function logout(){

 localStorage.removeItem("mer_user");

 location.reload();

}


/* WORKER */

async function loadWorker(){

 await loadWork();

 await loadRoute();

 await loadActiveVisit();

}


/* AKTİV İŞ */

async function loadWork(){

 try{

   const j=await api(
     "/work/active?worker_id="+
     encodeURIComponent(user.id)
   );


   /* DÜZƏLİŞ:
      Worker "session" qaytarır */
   activeWork=
     j.session ||
     null;


   document
     .getElementById("workInfo")
     .innerHTML=

     activeWork

     ?

     '<span class="ok">🟢 İşdədir</span><br>'+
     'Başlanğıc: '+
     new Date(
       activeWork.start_time
     ).toLocaleString("az-AZ")

     :

     '<span class="bad">🔴 İş başlamayıb</span>';

 }catch(e){

   document
     .getElementById("workInfo")
     .textContent=
     e.message;

 }

}


/* İŞƏ BAŞLA */

async function startWork(){

 try{

   /* Telefonun GPS-ni al */
   const p=await position();


   /* Worker-ə düzgün adlarla göndər */
   const j=await api(
     "/work/start",
     {
       method:"POST",

       body:JSON.stringify({

         worker_id:user.id,

         latitude:
           p.coords.latitude,

         longitude:
           p.coords.longitude

       })
     }
   );


   alert(
     j.message ||
     "✅ İş başladı"
   );


   /* Aktiv işi yenilə */
   await loadWork();


   /* GPS izləməsini başlat */
   startGPS();


 }catch(e){

   alert(
     "⚠️ "+e.message
   );

 }

}


/* İŞİ BİTİR */

async function endWork(){

 if(
   !confirm(
     "İşi bitirmək istəyirsiniz?"
   )
 )return;


 try{

   const p=await position();


   const j=await api(
     "/work/end",
     {
       method:"POST",

       body:JSON.stringify({

         worker_id:user.id,

         latitude:
           p.coords.latitude,

         longitude:
           p.coords.longitude

       })
     }
   );


   alert(
     j.message ||
     "İş bitdi"
   );


   activeWork=null;

   stopGPS();

   await loadWork();

   await loadActiveVisit();


 }catch(e){

   alert(
     "⚠️ "+e.message
   );

 }

}


/* MARŞRUT */

async function loadRoute(){

 try{

   const d=
     document
       .getElementById("day")
       .value;


   const j=await api(
     "/routes?worker_id="+
     encodeURIComponent(user.id)+
     "&day="+d
   );


   currentRoute=
     j.stores ||
     [];


   const box=
     document.getElementById("route");


   if(!currentRoute.length){

     box.innerHTML=
       "<p>Bu gün mağaza təyin edilməyib.</p>";

     return;

   }


   box.innerHTML=
     currentRoute
     .map((s,i)=>`

       <div class="store">

         <b>
           ${esc(s.chain)}
           —
           ${esc(s.name)}
         </b>

         <div class="small">
           ID:
           ${esc(s.id)}
           |
           Radius:
           ${s.radius||500} m
         </div>

         <button
           onclick="startVisit('${escAttr(s.id)}')"
         >
           📍 Mağazaya daxil ol
         </button>

       </div>

     `)
     .join("");


 }catch(e){

   document
     .getElementById("route")
     .textContent=
     e.message;

 }

}


/* MAĞAZAYA GİRİŞ */

async function startVisit(storeId){

 try{

   if(!activeWork){

     alert(
       "Əvvəlcə işə başlamalısınız."
     );

     return;

   }


   const p=await position();


   const j=await api(
     "/visits/start",
     {
       method:"POST",

       body:JSON.stringify({

         worker_id:user.id,

         store_id:storeId,

         session_id:
           activeWork.id,

         /* DÜZƏLİŞ */
         latitude:
           p.coords.latitude,

         longitude:
           p.coords.longitude

       })
     }
   );


   if(
     j.distance !==
     undefined
   ){

     alert(
       "Məsafə: "+
       Math.round(j.distance)+
       " m"
     );

   }


   /* Serverdən aktiv ziyarəti yenidən götür */
   await loadActiveVisit();


   /* GPS izləməsini aktiv saxla */
   startGPS();


 }catch(e){

   alert(
     "⚠️ "+e.message
   );

 }

}


/* AKTİV ZİYARƏT */

async function loadActiveVisit(){

 try{

   const j=await api(
     "/visits/active?worker_id="+
     encodeURIComponent(user.id)
   );


   activeVisit=
     j.visit ||
     null;


   showVisit();


 }catch(e){}

}


/* ZİYARƏT GÖSTƏR */

function showVisit(){

 const c=
   document.getElementById(
     "visitCard"
   );


 if(!activeVisit){

   c.classList.add("hidden");

   return;

 }


 c.classList.remove("hidden");


 document
   .getElementById("visitInfo")
   .innerHTML=

   "Mağaza: <b>"+
   esc(activeVisit.store_id)+
   "</b><br>"+
   "Başlanğıc: "+
   new Date(
     activeVisit.start_time
   ).toLocaleString("az-AZ");

}


/* ZİYARƏTİ BİTİR */

async function finishVisit(){

 if(!activeVisit)return;


 try{

   const p=await position();


   const note=
     prompt(
       "Qeyd (istəyə görə):"
     ) ||
     "";


   const j=await api(
     "/visits/end",
     {
       method:"POST",

       body:JSON.stringify({

         worker_id:user.id,

         visit_id:
           activeVisit.id,

         /* DÜZƏLİŞ */
         latitude:
           p.coords.latitude,

         longitude:
           p.coords.longitude,

         note:note

       })
     }
   );


   alert(
     j.message ||
     "Ziyarət tamamlandı"
   );


   activeVisit=null;

   showVisit();

   stopGPS();

   await loadRoute();


 }catch(e){

   alert(
     "⚠️ "+e.message
   );

 }

}


/* GPS */

let gpsWatch=null;


function startGPS(){

 if(
   !navigator.geolocation
 )return;


 if(
   gpsWatch!==null
 )return;


 gpsWatch=
   navigator.geolocation.watchPosition(

     async p=>{

       try{

         await api(
           "/gps",
           {
             method:"POST",

             body:JSON.stringify({

               worker_id:user.id,

               session_id:
                 activeWork?.id,

               visit_id:
                 activeVisit?.id,

               latitude:
                 p.coords.latitude,

               longitude:
                 p.coords.longitude,

               accuracy:
                 p.coords.accuracy

             })
           }
         );

       }catch(e){}

     },

     ()=>{},

     {
       enableHighAccuracy:true,
       maximumAge:10000,
       timeout:15000
     }

   );

}


/* GPS DAYANDIR */

function stopGPS(){

 if(
   gpsWatch!==null
 ){

   navigator.geolocation.clearWatch(
     gpsWatch
   );

   gpsWatch=null;

 }

}


/* TELEFON GPS */

function position(){

 return new Promise(
   (resolve,reject)=>{

     if(
       !navigator.geolocation
     ){

       return reject(
         new Error(
           "Telefon GPS-i dəstəkləmir."
         )
       );

     }


     navigator.geolocation.getCurrentPosition(

       resolve,

       error=>{

         let msg=
           "GPS məkanı alınmadı.";

         if(
           error.code===1
         ){

           msg=
             "Məkan icazəsi verilməyib. Telefonun GPS və brauzer üçün məkan icazəsini açın.";

         }else if(
           error.code===2
         ){

           msg=
             "GPS məkanı müəyyən edə bilmədi.";

         }else if(
           error.code===3
         ){

           msg=
             "GPS cavabı gecikdi. Açıq havada yenidən yoxlayın.";

         }

         reject(
           new Error(msg)
         );

       },

       {
         enableHighAccuracy:true,
         timeout:15000,
         maximumAge:5000
       }

     );

   }
);


/* MÜDİR PANELİ */

async function loadAdmin(){

 try{

   const [w,s]=
     await Promise.all([

       api("/workers"),

       api("/stores")

     ]);


   document
     .getElementById("stats")
     .innerHTML=

     `👥 İşçi:
      <b>${(w.workers||[]).length}</b>
      &nbsp;
      🏪 Mağaza:
      <b>${(s.stores||[]).length}</b>`;


   document
     .getElementById("workers")
     .innerHTML=

     (w.workers||[])
     .map(x=>`

       <div class="store">

         <b>
           ${esc(x.name)}
         </b>

         <div class="small">
           ${esc(x.id)}
         </div>

       </div>

     `)
     .join("");


   document
     .getElementById("stores")
     .innerHTML=

     (s.stores||[])
     .map(x=>`

       <div class="store">

         <b>
           ${esc(x.chain)}
           —
           ${esc(x.name)}
         </b>

         <div class="small">

           ID:
           ${esc(x.id)}

           |
           GPS:
           ${x.latitude??"-"},
           ${x.longitude??"-"}

           |
           Radius:
           ${x.radius||500}m

         </div>


         <button
           class="danger"
           onclick="deleteStore('${escAttr(x.id)}')"
         >
           Sil
         </button>

       </div>

     `)
     .join("");


 }catch(e){

   document
     .getElementById("stats")
     .textContent=
     e.message;

 }

}


/* MAĞAZA ƏLAVƏ ET */

async function addStore(){

 try{

   const chain=
     document
       .getElementById("newChain")
       .value
       .trim();


   const name=
     document
       .getElementById("newStore")
       .value
       .trim();


   const lat=
     parseFloat(
       document
         .getElementById("newLat")
         .value
     );


   const lng=
     parseFloat(
       document
         .getElementById("newLng")
         .value
     );


   const radius=
     parseInt(
       document
         .getElementById("newRadius")
         .value
     ) ||
     500;


   if(!chain||!name){

     throw new Error(
       "Şəbəkə və mağaza adı yazılmalıdır."
     );

   }


   const id=
     Date.now().toString();


   await api(
     "/stores",
     {
       method:"POST",

       body:JSON.stringify({

         id,
         chain,
         name,

         latitude:
           Number.isFinite(lat)
           ? lat
           : null,

         longitude:
           Number.isFinite(lng)
           ? lng
           : null,

         radius

       })
     }
   );


   alert(
     "Mağaza əlavə edildi."
   );


   loadAdmin();


 }catch(e){

   alert(
     "⚠️ "+e.message
   );

 }

}


/* MAĞAZA SİL */

async function deleteStore(id){

 if(
   !confirm(
     "Bu mağazanı silmək istəyirsiniz?"
   )
 )return;


 try{

   await api(
     "/stores/"+
     encodeURIComponent(id),
     {
       method:"DELETE"
     }
   );


   loadAdmin();


 }catch(e){

   alert(
     e.message
   );

 }

}


/* HTML TƏHLÜKƏSİZLİYİ */

function esc(x){

 return String(
   x??""
 ).replace(
   /[&<>"']/g,
   m=>({

     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#039;"

   }[m])
 );

}


function escAttr(x){

 return String(
   x??""
 )
 .replace(
   /\\/g,
   "\\\\"
 )
 .replace(
   /'/g,
   "\\'"
 );

}


/* SAXLANMIŞ İSTİFADƏÇİ */

const saved=
  localStorage.getItem(
    "mer_user"
  );


if(saved){

 try{

   user=
     JSON.parse(saved);

   showApp();

 }catch(e){}

}


/* HƏR 15 SANİYƏDƏ YENİLƏ */

setInterval(
 ()=>{

   if(
     user?.role!=="admin"
   ){

     loadWork();

     loadActiveVisit();

   }

 },
 15000
);

</script>

</body>
</html>
